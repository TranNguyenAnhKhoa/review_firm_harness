# Same voice settings as moana.v3.yaml; reuse verified narration, never resynthesize.
video:
  codec: libx264
  crf: 20
  preset: veryfast
  duration_matching:
    enabled: true
    min_speed: 0.90
    max_speed: 1.10
    fallback: error
subtitle:
  position: top
  font_size: 40
  margin_vertical: 60
render:
  keep_source_resolution: true
