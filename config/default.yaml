# Harness defaults. A job overrides any key in jobs/<job>/config.yaml (the dashboard writes that file).
# Relative paths are resolved against the harness root.

# Human approval gates: the pipeline stops after these stages until you approve them.
gates: [read, write]

agents:
  # READ: the agent watches the film (agy: video file; claude/codex: frame sheets + subtitle strips)
  # and writes 02_read/timeline.md. manual: you paste timeline.md in the dashboard.
  read:
    engine: agy             # agy (watches video) | claude | codex (frame sheets) | manual
    model: ""               # passed to the CLI as --model; empty = the CLI's default model
    effort: ""              # claude/agy --effort: low | medium | high | xhigh | max; empty = default
    timeout_minutes: 90
  # WRITE: the agent turns timeline.md into 03_write/review.json, then the harness validates it.
  write:
    engine: agy             # agy | claude | codex | manual
    model: ""
    effort: ""
    timeout_minutes: 60
    fix_rounds: 2           # re-prompts with the validation errors when review.json is invalid
  # After MEASURE fails the 40-50% / 10-20 s rules, re-run WRITE with the measured report this many times.
  revise_rounds: 2
  claude:
    bin: claude
    tools: [Read, Write, Edit, Glob, Grep]
  agy:
    bin: agy
  codex:
    bin: codex
    sandbox: workspace-write

read:
  # One frame every N seconds; 0 = pick N so the film yields about max_frames frames.
  frame_interval: 0
  max_frames: 480
  sheet_columns: 4
  sheet_rows: 4
  frame_width: 384
  # agy only: proxy chunks it can open (timecode burned in). Small enough for its file reader.
  proxy:
    height: 360
    fps: 10
    chunk_minutes: 10
    crf: 32
    audio_kbps: 48
  # claude/codex only: bottom strip of each frame, stacked into sheets, so the agent can read hard subtitles.
  subtitle_strips: true
  strip_interval: 2.0
  strip_height_ratio: 0.2
  scene_detect: true
  # off | whisper (needs requirements-optional.txt)
  transcript: off
  whisper_model: small
  whisper_language: ""     # "" = auto detect

measure:
  workers: 2

render:
  fps: 30
  keep_source_resolution: true
  workers: 2
  threads: 3
  picture_style:
    enabled: true
    width: 1920
    height: 1080
    top_bar: 116
    bottom_bar: 116
    crop_source_bars: true
    fit_mode: cover
    watermark: "Review Phim"
    font_size: 28
    margin_right: 90
    margin_bottom: 250

video:
  codec: "libx264"
  crf: 20
  preset: "medium"
  duration_matching:
    enabled: true
    min_speed: 0.90
    max_speed: 1.10
    fallback: error

scene_detection:
  threshold: 27.0

tts:
  provider: "zerotts"       # zerotts (offline) | edge (Internet, requirements-optional.txt)
  language: "vi-VN"
  voice: "baotrang"         # baotrang | maichi | kimoanh
  rate: "+0%"
  pitch: "+0Hz"
  zerotts:
    model: models/zerotts/ZeroTTS-c2bfbd67   # local folder of real files, filled by ./setup.sh
    repo: zeroweight-ai/ZeroTTS
    revision: c2bfbd67dc648cac455077333f7cf5c18a2e3bb4
    local_files_only: true
    cache_dir: models/zerotts/hf-cache
    threads: 4
  presets:
    normal: {rate_percent: 24, pitch_hz: 0, volume_percent: 0, pause_before_ms: 0, pause_after_ms: 100}
    suspense: {rate_percent: 22, pitch_hz: 0, volume_percent: -1, pause_before_ms: 0, pause_after_ms: 160}
    excited: {rate_percent: 26, pitch_hz: 0, volume_percent: 1, pause_before_ms: 0, pause_after_ms: 80}
    serious: {rate_percent: 22, pitch_hz: 0, volume_percent: 0, pause_before_ms: 0, pause_after_ms: 140}
    punchline: {rate_percent: 20, pitch_hz: 0, volume_percent: 1, pause_before_ms: 0, pause_after_ms: 180}
    calm: {rate_percent: 22, pitch_hz: 0, volume_percent: 0, pause_before_ms: 0, pause_after_ms: 160}
  natural_variation: {enabled: true, rate_jitter_percent: 1, pitch_jitter_hz: 0, pause_jitter_ms: 15, seed: 42}
  pause_boundary: max
  micro_pause: {enabled: true, comma_ms: 90, semicolon_ms: 150, colon_ms: 120, ellipsis_ms: 300}
  target_speech:
    enabled: true
    target_syllables_per_second: 5.4
    min_syllables_per_second: 4.9
    max_syllables_per_second: 5.9
    retry_limit: 2
    max_rate_adjustment_percent: 8
  speech_rate_ranges:
    normal: {min: 4.9, max: 5.9}
    suspense: {min: 4.7, max: 5.7}
    excited: {min: 5.0, max: 6.1}
    serious: {min: 4.7, max: 5.7}
    punchline: {min: 4.6, max: 5.6}
    calm: {min: 4.7, max: 5.7}

audio:
  narration_volume: 1.0
  background_volume: 0.08
  narration:
    loudness_lufs: -16
    true_peak_db: -1.5

subtitle:
  enabled: false
  format: "ass"
  font_size: 48
  position: "bottom"
  max_chars_per_line: 35

editorial:
  min_source_ratio: 0.40
  max_source_ratio: 0.50
  preferred_source_ratio: 0.45
  assessment_min_seconds: 10
  assessment_max_seconds: 20
  assessment_target_seconds: 15
  tone: humorous_youthful_contextual
